[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derivatrace"
version = "0.1.0.dev0"
description = "An open-source evidence-carrying derivatives compiler and model-risk laboratory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amrut Deshmukh" }]
keywords = [
    "derivatives",
    "financial-contracts",
    "evidence",
    "certificate",
    "model-risk",
    "reproducibility",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sciwiz7/DerivaTrace"
Documentation = "https://github.com/sciwiz7/DerivaTrace"
Repository = "https://github.com/sciwiz7/DerivaTrace"
"Source Code" = "https://github.com/sciwiz7/DerivaTrace"
Issues = "https://github.com/sciwiz7/DerivaTrace/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "build>=1.2,<2.0",
    "pre-commit>=3.8,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/derivatrace"]

[tool.hatch.build.targets.sdist]
include = [
    "src/derivatrace",
    "tests",
    "docs",
    ".github",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "ROADMAP.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "GOVERNANCE.md",
    "pyproject.toml",
    ".editorconfig",
    ".pre-commit-config.yaml",
]
exclude = [
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".venv",
    "venv",
    "env",
    "dist",
    "build",
    "*.egg-info",
    "__pycache__",
    "*.pyc",
    ".pre-commit-cache",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".venv",
    "dist",
    "build",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "W",
    "C4",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["derivatrace"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src/derivatrace", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
